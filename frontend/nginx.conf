server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow up to 60MB uploads to comfortably accommodate the 50MB max file size limit
    client_max_body_size 60M;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Reverse proxy for backend API endpoints
    # Routes all /api/* requests directly to the internal backend container
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeouts for long-running PDF OCR & batch operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable buffering for smooth file streaming & progress
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Cache immutable static assets with unique content hashes
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Never cache index.html so updates are instantly reflected
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # SPA Routing: Fall back all unmatched client-side routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check probe for Nginx web server
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
