services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fileora-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - FILE_TTL_MINUTES=${FILE_TTL_MINUTES:-30}
    volumes:
      - fileora_uploads:/app/uploads
      - fileora_outputs:/app/outputs
    expose:
      - "5000"
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - fileora-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: fileora-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - fileora-network

networks:
  fileora-network:
    driver: bridge

volumes:
  fileora_uploads:
    driver: local
  fileora_outputs:
    driver: local
